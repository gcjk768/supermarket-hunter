services:
  supermarket-hunter:
    build:
      context: .
      args:
        UID: 1000
    # Dockge Update rebuilds from the code on disk
    pull_policy: build
    image: supermarket-hunter:local
    container_name: supermarket-hunter
    restart: unless-stopped
    init: true
    # scrape-net: the shared Playwright server (ws://playwright:3000) for pages Jina cannot read. External network, so no new
    # compose subnet is needed (the NAS has none left)
    networks: [scrape-net]
    ports:
      - "8790:8000"   # family web page: http://<nas-ip>:8790
    env_file: .env
    environment:
      TZ: Asia/Singapore
      DATA_DIR: /app/data
      VAULT_DIR: /vault
      REPORT_AT: "daily 08:00"     # full refresh (every store + flyers)
      PROMO_CHECK_HOURS: "3"       # quick price refresh between the daily runs (0 = off)
      PLAYWRIGHT_WS_URL: ws://playwright:3000/
    volumes:
      - ./data:/app/data
      # Obsidian vault: movement log + memory
      - "/volume1/<USER>/Obsidian/Supermarket Hunter:/vault"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    # One shot commands on the NAS:
    #   docker compose exec supermarket-hunter python -m smh refresh     # full refresh now
    #   docker compose exec supermarket-hunter python -m smh ask eggs
networks:
  scrape-net:
    external: true
